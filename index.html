 let h=`<div class="card"><div class="g"><div><label>শ্রেণি</label><select onchange="V.cls=this.value;V.sel=null;render()">${opts(CL,V.cls)}</select></div><div><label>&nbsp;</label><button class="btn" onclick="addSt()">+ নতুন শিক্ষার্থী</button></div></div><p><small>এই শ্রেণিতে ${bn(L.length)} জন শিক্ষার্থী</small></p><div class="scroll"><table>${L.map(s=>`<tr><td>${bn(s.roll)}</td><td>${esc(s.name)||'<small>নামহীন</small>'}</td><td><button class="btn s" onclick="V.sel=${s.id};render()">নম্বর/সম্পাদনা</button> <button class="btn s r" onclick="delSt(${s.id})">মুছুন</button></td></tr>`).join('')}</table></div></div>`;
 if(!st||st.cls!=V.cls)return h;const c=+st.cls,f=(k,l,t)=>`<div><label>${l}</label><input ${t||''} value="${esc(st[k])}" onchange="upS('${k}',this.value,0)"></div>`,se=(k,l,o)=>`<div><label>${l}</label><select onchange="upS('${k}',this.value,1)">${opts(o,st[k])}</select></div>`;
 h+=`<div class="card"><h3>${esc(st.name)||'নতুন শিক্ষার্থী'}</h3><div class="g">${f('roll','রোল','type=number')}${f('name','নাম')}${f('father','পিতার নাম')}${f('mother','মাতার নাম')}${se('rel','ধর্ম',Object.fromEntries(Object.keys(RN).map(k=>[k,k])))}`;
 if(c>=9){h+=se('div','বিভাগ',DIV);if(st.div=='sci')h+=se('main3','তৃতীয় মূল বিষয়',{bio:'জীববিজ্ঞান',hm:'উচ্চতর গণিত'});h+=se('f4','চতুর্থ বিষয়',f4o(st))}
 if(c>=6&&c<=8)h+=se('opt','ঐচ্ছিক বিষয়',OPT);
 h+=`</div></div><div class="card"><h3>নম্বর এন্ট্রি</h3>`;
 subs(c,st).forEach(({s,r})=>{const m=st.marks[s.id]||{},inp=(k,l,mx)=>`<div><label>${l} (${bn(mx)})</label><input type="number" min="0" max="${mx}" step="any" value="${m[k]==null?'':m[k]}" oninput="setM(this,'${s.id}','${k}',${mx})"></div>`;
  const fl=s.t8?[1,2,3,4,5,6,7,8].map(i=>inp('a'+i,'অভীক্ষা '+bn(i),20)).join(''):s.parts.map(p=>inp(p.k,p.l,p.m)).join('')+(s.conv?inp('ct','শ্রেণি অভীক্ষা',s.ct):'');
  h+=`<div class="sb"><b>${s.n}${r=='f'?' <em>(চতুর্থ বিষয়)</em>':''}</b> <small>পূর্ণমান ${bn(s.max)}${s.t8?' · সেরা ৫টি গণনা':''}</small><div class="g2">${fl}</div></div>`});
 return h+`<label>শ্রেণি শিক্ষকের মন্তব্য</label><textarea rows="2" onchange="upS('comment',this.value,0)">${esc(st.comment)}</textarea></div><div class="card"><h3>ফলাফল (লাইভ)</h3><div id="pv">${pvh(st)}</div></div>`}
/* সাধারণ অংশ */
const picker=()=>`<div class="card g"><div><label>শ্রেণি</label><select onchange="V.cls=this.value;V.sel=null;render()">${opts(CL,V.cls)}</select></div><div><label>রোল নির্বাচন</label><select onchange="V.sel=+this.value;render()"><option value="">— নির্বাচন —</option>${stl().map(s=>`<option value="${s.id}"${s.id==V.sel?' selected':''}>${bn(s.roll)} – ${esc(s.name)||'নামহীন'}</option>`).join('')}</select></div><div><label>&nbsp;</label><button class="btn" onclick="print()">🖨 প্রিন্ট</button></div></div>`;
const hd=t=>`<div class="sh"><div class="mono">${S.cfg.logo?`<img src="${S.cfg.logo}">`:'মনোগ্রাম'}</div><div class="c"><h2>পানিপুর জেলা স্কুল</h2><div>একটি মনতেশ্বরী শিক্ষা প্রতিষ্ঠান</div><div>হাটকালুপাড়া মহাসড়ক, পানিপুর</div></div><div class="mono ghost"></div></div><h3 class="tt">${t}</h3>`;
const info=st=>`<table><tr><td>নাম</td><td class="l">${esc(st.name)}</td><td>রোল</td><td>${bn(st.roll)}</td></tr><tr><td>পিতা</td><td class="l">${esc(st.father)}</td><td>শ্রেণি</td><td>${bn(st.cls)}${+st.cls>8?' ('+DIV[st.div]+')':''}</td></tr><tr><td>মাতা</td><td class="l">${esc(st.mother)}</td><td>পরীক্ষা</td><td>${esc(S.cfg.exam)}</td></tr></table>`;
const sig=a=>`<div class="sg">${a.map(([t,n])=>`<div><div class="ln"></div><b>${t}</b><small>${esc(n||'')}</small></div>`).join('')}</div>`;
const fd=d=>d?new Date(d).toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'—';
const need=()=>picker()+'<div class="card">উপরে থেকে একজন শিক্ষার্থী নির্বাচন করুন।</div>';
function vAdm(){const st=cur();if(!st||st.cls!=V.cls)return need();
 return picker()+`<div class="sheet">${hd('প্রবেশপত্র')}${info(st)}<table><tr><th>ক্রম</th><th>বিষয়</th><th>তারিখ</th><th>সময়</th></tr>${subs(st.cls,st).map(({s},i)=>{const r=S.routine[st.cls+'_'+s.id]||{};return `<tr><td>${bn(i+1)}</td><td class="l">${s.n}</td><td>${fd(r.d)}</td><td>${esc(r.t||'')}</td></tr>`}).join('')}</table><p style="font-size:12px">পরীক্ষার হলে এই প্রবেশপত্র সঙ্গে আনা বাধ্যতামূলক।</p>${sig([['পরীক্ষার্থীর স্বাক্ষর'],['প্রধান শিক্ষক',S.cfg.head]])}</div>`}
function vTr(){const st=cur();if(!st||st.cls!=V.cls)return need();const c=calc(st),R=rk(st);
 return picker()+`<div class="sheet">${hd('একাডেমিক ট্রান্সক্রিপ্ট – '+esc(S.cfg.exam))}${info(st)}${tbl(c,R,st)}<div class="sum"><span>জিপিএ: ${bn(c.gpa.toFixed(2))}</span><span>ফলাফল: <span class="${c.pass?'pass':'fail'}">${c.pass?'কৃতকার্য':'অকৃতকার্য'}</span></span><span>মেধাক্রম: ${bn(R.rank)} (মোট ${bn(R.n)} জনের মধ্যে)</span></div><div style="border:1px solid #444;padding:8px;min-height:52px"><b>শ্রেণি শিক্ষকের মন্তব্য:</b> ${esc(st.comment)}</div>${sig([['শ্রেণি শিক্ষক'],['সহকারী প্রধান শিক্ষক',S.cfg.asst],['প্রধান শিক্ষক',S.cfg.head],['অভিভাবক']])}</div>`}
function tbl(c,R,st){const fl=o=>o.n+(o.r=='f'?' (চতুর্থ বিষয়)':'');
 if(+st.cls<6)return `<table><tr><th>বিষয়</th><th>পূর্ণমান</th><th>প্রাপ্ত নম্বর</th><th>শ্রেণির সর্বোচ্চ</th><th>গ্রেড</th><th>জিপি</th></tr>${c.rows.map(o=>`<tr><td class="l">${fl(o)}</td><td>${bn(o.max)}</td><td>${bn(o.f)}</td><td>${bn(R.hi(o.key))}</td><td>${o.g}</td><td>${bn(o.gp.toFixed(2))}</td></tr>`).join('')}<tr><th>মোট</th><th>${bn(c.tm)}</th><th>${bn(c.tot)}</th><th></th><th>${c.pass?gl(c.gpa):'F'}</th><th>${bn(c.gpa.toFixed(2))}</th></tr></table>`;
 const N=x=>bn(+x.toFixed(2)),cell=(o,k)=>o.d[k]?`<td>${N(o.d[k][0])}/${N(o.d[k][1])}</td>`:'<td>—</td>';
 return `<table style="font-size:12px"><tr><th>বিষয়</th><th>সৃজনশীল</th><th>এমসিকিউ</th><th>লিখিত</th><th>ব্যবহারিক</th><th>শ্রেণি অভীক্ষা</th><th>শ্রেণি ও বাড়ির কাজ</th><th>মোট প্রাপ্ত</th><th>পূর্ণমান</th><th>শ্রেণির সর্বোচ্চ</th><th>গ্রেড</th><th>জিপি</th></tr>${c.rows.map(o=>`<tr><td class="l">${fl(o)}</td>${['c','m','w','p','ct','cw'].map(k=>cell(o,k)).join('')}<td>${bn(o.f)}</td><td>${bn(o.max)}</td><td>${bn(R.hi(o.key))}</td><td>${o.g}</td><td>${bn(o.gp.toFixed(2))}</td></tr>`).join('')}<tr><th>মোট</th><th colspan="6"></th><th>${bn(c.tot)}</th><th>${bn(c.tm)}</th><th></th><th>${c.pass?gl(c.gpa):'F'}</th><th>${bn(c.gpa.toFixed(2))}</th></tr></table>`}
/* রুটিন ও সেটিংস */
function setR(id,k,v){const key=V.cls+'_'+id;S.routine[key]=S.routine[key]||{};S.routine[key][k]=v;save()}
function logo(f){if(!f)return;const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const k=Math.min(1,200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.cfg.logo=c.toDataURL('image/png');save();render()};i.src=e.target.result};r.readAsDataURL(f)}
const cf=(k,l)=>`<div><label>${l}</label><input value="${esc(S.cfg[k])}" onchange="S.cfg.${k}=this.value;save()"></div>`;
function vSet(){return `<div class="card"><h3>সাধারণ সেটিংস</h3><div class="g">${cf('exam','পরীক্ষার নাম')}${cf('head','প্রধান শিক্ষক')}${cf('asst','সহকারী প্রধান শিক্ষক')}<div><label>মনোগ্রাম (ছবি)</label><input type="file" accept="image/*" onchange="logo(this.files[0])"></div></div></div>
<div class="card"><h3>পরীক্ষার রুটিন</h3><div class="g"><div><label>শ্রেণি</label><select onchange="V.cls=this.value;render()">${opts(CL,V.cls)}</select></div></div><div class="scroll"><table><tr><th>বিষয়</th><th>তারিখ</th><th>সময়</th></tr>${subs(V.cls,null).map(({s})=>{const r=S.routine[V.cls+'_'+s.id]||{};return `<tr><td>${s.n}</td><td><input type="date" value="${r.d||''}" onchange="setR('${s.id}','d',this.value)"></td><td><input value="${esc(r.t)}" placeholder="সকাল ১০:০০" onchange="setR('${s.id}','t',this.value)"></td></tr>`}).join('')}</table></div></div>
<div class="card"><h3>ব্যাকআপ</h3><p><small>ডাটা এই ব্রাউজারেই জমা থাকে। নিয়মিত ব্যাকআপ কপি করে রাখুন।</small></p><textarea id="bk" rows="4"></textarea><p><button class="btn s" onclick="$('#bk').value=JSON.stringify(S)">ডাটা দেখান</button> <button class="btn s" onclick="try{S=JSON.parse($('#bk').value);save();render();alert('ইম্পোর্ট হয়েছে')}catch(e){alert('ভুল ডাটা')}">ইম্পোর্ট</button></p></div>`}
function render(){const T=['শিক্ষার্থী ও নম্বর','এডমিট কার্ড','ট্রান্সক্রিপ্ট','রুটিন ও সেটিংস'];$('#nav').innerHTML=T.map((t,i)=>`<button class="${V.tab==i?'on':''}" onclick="V.tab=${i};render()">${t}</button>`).join('');$('#app').innerHTML=[vStu,vAdm,vTr,vSet][V.tab]()}
firebase.initializeApp(firebaseConfig);DB=firebase.firestore();AUTH=firebase.auth();
AUTH.onAuthStateChanged(u=>{$('#lo').style.display=u?'':'none';if(u){$('#app').innerHTML='<div class="card">ডাটা লোড হচ্ছে…</div>';load().catch(e=>{$('#app').innerHTML='<div class="card">ডাটা আনা যায়নি: '+esc(e.message)+'</div>'})}else showLogin()});
</script></body></html>
