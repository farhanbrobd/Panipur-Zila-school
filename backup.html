<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ডাটা ব্যাকআপ ও পুনরুদ্ধার</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;max-width:720px;margin:20px auto;padding:0 12px}input,textarea,button{display:block;width:100%;margin:8px 0;padding:10px;font:inherit;box-sizing:border-box}button{background:#3b4cca;color:#fff;border:0;border-radius:8px;cursor:pointer}textarea{height:280px}#m{color:#1a7f37;font-weight:600}</style></head><body>
<h2>ডাটা ব্যাকআপ ও পুনরুদ্ধার</h2><p>এটি আপনার ফলাফলের ডাটার (শিক্ষার্থী, নম্বর, সেটিংস) একটি কপি নেয়।</p>
<div id="lg"><input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button onclick="login()">লগইন</button></div>
<div id="ap" style="display:none"><button onclick="bk()">১) ডাটা ব্যাকআপ নিন</button><button onclick="dl()">২) ফাইল হিসেবে সেভ করুন (JSON)</button><textarea id="t" placeholder="ব্যাকআপের লেখা এখানে আসবে। পুনরুদ্ধারের সময় এখানে ব্যাকআপের লেখা বসান।"></textarea><button onclick="rs()" style="background:#c0392b">৩) পুনরুদ্ধার (ঘরের ডাটা ডাটাবেজে ফিরিয়ে লিখুন)</button><p id="m"></p></div>
<script>
const cfg={apiKey:"AIzaSyBf_moIuGudd9br9yQ9Ip6YT3dN97F7jZw",authDomain:"pzs-93c0b.firebaseapp.com",projectId:"pzs-93c0b",storageBucket:"pzs-93c0b.firebasestorage.app",messagingSenderId:"197470667418",appId:"1:197470667418:web:54e6a19a0ff48ef5fdd523"};
firebase.initializeApp(cfg);const DB=firebase.firestore(),A=firebase.auth(),$=s=>document.querySelector(s),msg=t=>{$('#m').textContent=t};
A.onAuthStateChanged(u=>{$('#lg').style.display=u?'none':'';$('#ap').style.display=u?'':'none'});
function login(){A.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(e=>alert('লগইন হয়নি: '+e.message))}
async function bk(){try{msg('পড়া হচ্ছে…');const q=await DB.collection('students').get(),m=await DB.collection('meta').doc('main').get();$('#t').value=JSON.stringify({students:q.docs.map(d=>Object.assign({_id:d.id},d.data())),meta:m.exists?m.data():null});msg(q.size+' জন শিক্ষার্থীর ডাটা পাওয়া গেছে। এখন "ফাইল হিসেবে সেভ করুন" চাপুন, বা ঘরের লেখা কপি করে রাখুন।')}catch(e){msg('ব্যর্থ: '+e.message)}}
function dl(){const t=$('#t').value;if(!t)return alert('আগে ব্যাকআপ নিন');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='result-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function rs(){try{const o=JSON.parse($('#t').value);if(!confirm('ঘরের ডাটা ডাটাবেজে ফিরিয়ে লেখা হবে (একই আইডির ডাটা বদলে যাবে)। নিশ্চিত?'))return;const L=o.students||[];for(let i=0;i<L.length;i+=400){const b=DB.batch();L.slice(i,i+400).forEach(s=>{const d=Object.assign({},s),id=d._id;delete d._id;b.set(DB.collection('students').doc(id),d)});await b.commit()}if(o.meta)await DB.collection('meta').doc('main').set(o.meta);msg('পুনরুদ্ধার হয়েছে: '+L.length+' জন শিক্ষার্থী')}catch(e){msg('ব্যর্থ: '+e.message)}}
</script></body></html>
